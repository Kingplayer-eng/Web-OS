<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJK WebOS</title>
  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-image: url('https://images7.alphacoders.com/132/1322952.jpeg');
      background-size: cover;
      background-position: center;
      font-family: Arial, sans-serif;
      color: white;
      transition: background-image 0.5s ease;
    }

    /* Google Search Bar */
    .search-box {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 10px;
    }

    .search-box input {
      padding: 12px 20px;
      border-radius: 20px;
      border: none;
      width: 280px;
      font-size: 14px;
      outline: none;
    }

    .search-box button {
      padding: 12px 20px;
      border-radius: 20px;
      border: none;
      background: #a855f7;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* Domain Launch Dock */
    .dock {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 20px;
      border-radius: 30px;
    }

    .dock button {
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* Back to Main Button */
    #back-btn {
      display: none;
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 12px 20px;
      background: #334155;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Search Bar -->
  <div class="search-box">
    <input type="text" id="search-input" placeholder="Search Google..." onkeydown="if(event.key === 'Enter') searchGoogle()">
    <button onclick="searchGoogle()">Search</button>
  </div>

  <!-- Domain Dock -->
  <div class="dock">
    <button style="background: #7c3aed;" onclick="setDomain('gojo')">🌀 Gojo</button>
    <button style="background: #dc2626;" onclick="setDomain('sukuna')">⛩️ Sukuna</button>
    <button style="background: #0d9488;" onclick="setDomain('mahito')">🖐️ Mahito</button>
    <button style="background: #eab308;" onclick="setDomain('megumi')">🐺 Megumi</button>
  </div>

  <!-- Reset Button -->
  <button id="back-btn" onclick="resetDesktop()">⬅ Back to Main</button>

  <script>
    let currentAudio = null;

    const wallpapers = {
      gojo: "https://wallpapercave.com/wp/wp12325840.jpg",
      sukuna: "https://i.pinimg.com/originals/db/96/d6/db96d6a89f37c3f25dbe576406514dee.jpg",
      mahito: "https://images8.alphacoders.com/135/1353166.png",
      megumi: "https://images3.alphacoders.com/134/1348123.png"
    };

    const tracks = {
      gojo: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73427.mp3",
      sukuna: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3",
      mahito: "https://cdn.pixabay.com/download/audio/2022/10/14/audio_99391e43d9.mp3",
      megumi: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3"
    };

    function searchGoogle() {
      const query = document.getElementById('search-input').value;
      if (query.trim() !== '') {
        window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
      }
    }

    function setDomain(domain) {
      // 1. Change Wallpaper
      document.body.style.backgroundImage = `url('${wallpapers[domain]}')`;

      // 2. Play Audio Track
      if (currentAudio) {
        currentAudio.pause();
      }
      currentAudio = new Audio(tracks[domain]);
      currentAudio.loop = true;
      currentAudio.play().catch(() => {});

      // 3. Show Reset Button
      document.getElementById('back-btn').style.display = 'block';
    }

    function resetDesktop() {
      document.body.style.backgroundImage = "url('https://images7.alphacoders.com/132/1322952.jpeg')";
      if (currentAudio) {
        currentAudio.pause();
      }
      document.getElementById('back-btn').style.display = 'none';
    }
  </script>

</body>
</html>
