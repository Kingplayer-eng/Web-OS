<!DOCTYPE html>
<html>
   <head>

  <title>JJK Inspired WebOS</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background-image: url('https://images7.alphacoders.com/132/1322952.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Fira Code', monospace;
      color: whitesmoke;
      transition: background-image 0.5s ease-in-out;
    }

  
    .search-box {
      text-align: center;
      margin-top: 80px;
    }

    .search-box input {
      padding: 10px;
      border-radius: 20px;
      border: none;
      width: 280px;
    }

    .search-box button {
      padding: 10px 15px;
      border-radius: 15px;
      border: none;
      background: #8b4166;   
      color: white;
      cursor: pointer;
    }
    .dock {
      position: absolute;
      bottom: 100px;
      left: 35px;
      background: black;
      padding: 10px;
      border-radius: 20px;
    }

    .dock button {
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      color: rgb(21, 11, 11);
      cursor: pointer;
      margin: 2px;
    }

    
    #back-btn {
      display: none;
      position: absolute;
      bottom: 100px;
      right: 20px;
      padding: 10px 15px;
      background: #334155;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* Floating Notepad */
    .notepad {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 220px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .notepad-header {
      font-size: 14px;
      font-weight: bold;
      color: #5c4ae0;
      text-align: center;
      margin-bottom: 8px;
    }

    .notepad textarea {
      width: 100%;
      height: 120px;
      background: transparent;
      border: none;
      color: whitesmoke;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      resize: none;
      outline: none;
      box-sizing: border-box;
    }

  </style>
</head>
<body>
  <p id="battery"></p>
  <p id="toolbar_dt"></p>
</div>
    </div>

  
  <div class="notepad">
    <div class="notepad-header">Cursed Notebook x JJK</div>
    <textarea placeholder="Type your cursed notes here..."></textarea>
  </div>

  
                   <div class="search-box">
    <input type="text" id="search-input" placeholder="Search Anything...">
    <button onclick="searchGoogle()">Search</button>
  </div>

  
  <div class="dock">
                    <button style="background: #301aab;" onclick="setGojo()">Gojo</button>
     <button style="background: #791818;" onclick="setSukuna()">Sukuna</button>
       <button style="background: #0d8d82;" onclick="setMahito()">Mahito</button>
     <button style="background: #eab308;" onclick="setMegumi()">Megumi</button>
  </div>

  
  <button id="back-btn" onclick="resetDesktop()">Back to Main</button>

  <script>
    var defaultNasaImage = "";
    var audio = new Audio();
    var voiceEffect = new Audio(); 

    function loadRandomNasaBackground() {
      var apiKey = "T5jztR1aRxXeavTvevaMwxAUAMFijxEK0FbJN5dI";
      var nasaUrl = "https://api.nasa.gov/planetary/apod?api_key=" + apiKey + "&count=1";

       fetch(nasaUrl)
        .then(function(response) {
          return response.json();
        })
        .then(function(data) {
          var item = data[0];
          if (item && item.media_type === "image") {
            var imageUrl = item.url;
            var imgPreloader = new Image();
            imgPreloader.src = imageUrl;

            imgPreloader.onload = function() {
              defaultNasaImage = imageUrl;
              document.body.style.backgroundImage = "url('" + imageUrl + "')";
            };
          } else {
            loadRandomNasaBackground();
          }
        })
        .catch(function(error) {
          console.log("Error Loading NASA image: " + error);
        });
    }

    loadRandomNasaBackground();

    function searchGoogle() {
      var query = document.getElementById('search-input').value;
      if (query !== "") {
        window.open ("https://www.google.com/search?q=" + encodeURIComponent(query)); 
      }
    }

    function playDomainVoice(voiceUrl, musicUrl) {
      audio.pause();
      voiceEffect.pause();

      voiceEffect = new Audio(voiceUrl);
      voiceEffect.play().catch(function(e) {
        console.log("Voice playback error: " + e);
      });

      voiceEffect.onended = function() {
        audio = new Audio(musicUrl);
        audio.loop = true;
        audio.play().catch(function(e) {
          console.log("Music playback error: " + e);
        });
      };
    }

              function setGojo() {
      document.body.style.backgroundImage = "url('https://static0.cbrimages.com/wordpress/wp-content/uploads/2024/02/satoru-gojo-domain-expansion.jpg?w=1200&h=675&fit=crop')";
      playDomainVoice("rpreplay_final1623689697_mov.mp3", "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73427.mp3");
      document.getElementById('back-btn').style.display = 'block';      
    }
      
    function setSukuna() {
      document.body.style.backgroundImage = "url('https://i.pinimg.com/originals/db/96/d6/db96d6a89f37c3f25dbe576406514dee.jpg')";
      playDomainVoice("rpreplay_final1623689697_mov.mp3", "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3");
      document.getElementById('back-btn').style.display = 'block';
    }

    function setMahito() {
      document.body.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTOtv1xcz7zVF0gUHdWVxRyVqeYhQr6xZ6heNNijBmD6g&s=10')";
      playDomainVoice("rpreplay_final1623689697_mov.mp3", "https://cdn.pixabay.com/download/audio/2022/10/14/audio_99391e43d9.mp3");
      document.getElementById('back-btn').style.display = 'block';
    }

    function setMegumi() {
      document.body.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_PYd6QIBZ-M3SFf65iSHG7t3BE34BOsLF1qWfvETkQg&s=10')";
      playDomainVoice("rpreplay_final1623689697_mov.mp3", "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3");
      document.getElementById('back-btn').style.display = 'block';
    }

    function resetDesktop() {
      if (defaultNasaImage !== "") {
        document.body.style.backgroundImage = "url('" + defaultNasaImage + "')";
      }
     
    }
  </script>

</body>
</html>
