<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  
  <style>
    /* Glowing pulse animation for domain buttons */
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.2); }
      50% { box-shadow: 0 0 15px rgba(255, 255, 255, 0.6); }
      100% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.2); }
    }

    /* Dramatic domain activation flash animation */
    @keyframes domainFlash {
      0% { opacity: 0; transform: scale(0.7); }
      50% { opacity: 0.95; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(1.2); }
    }

    /* JJK Cursed Energy Pulse for Volume Slider */
    @keyframes cursedPulse {
      0% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.4), inset 0 0 8px rgba(0, 0, 0, 0.8); }
      50% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.8), inset 0 0 12px rgba(168, 85, 247, 0.3); }
      100% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.4), inset 0 0 8px rgba(0, 0, 0, 0.8); }
    }

    .domain-btn {
      padding: 10px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      animation: pulseGlow 3s infinite;
    }

    .domain-btn:hover {
      transform: translateY(-5px) scale(1.08);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.5);
    }

    #domain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      display: none;
      z-index: 100;
    }

    #domain-overlay.active {
      display: block;
      animation: domainFlash 0.7s ease-out forwards;
    }

    /* JJK Custom Range Input Styling */
    input[type=range]#volume-slider {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background: rgba(40, 20, 60, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.5);
      height: 6px;
      border-radius: 3px;
      outline: none;
    }

    input[type=range]#volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #c084fc;
      box-shadow: 0 0 8px #a855f7;
      cursor: pointer;
    }

    input[type=range]#volume-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #c084fc;
      box-shadow: 0 0 8px #a855f7;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body style="background-image: url('https://images7.alphacoders.com/132/1322952.jpeg'); background-size: cover; background-position: center; background-repeat: no-repeat; margin: 0; width: 100vw; height: 100vh; overflow: hidden; color: #ffffff; font-weight: 500; transition: background-image 0.8s ease;">

  <div id="domain-overlay"></div>

  <div style="position: fixed; top: 20px; right: 20px; z-index: 20;">
    <button id="weather-btn" onclick="toggleWeatherModal()" style="padding: 10px 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(0, 0, 0, 0.6); color: white; font-weight: bold; cursor: pointer; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 8px; transition: 0.3s;">
      <span id="weather-icon">🌤️</span>
      <span id="weather-temp">--°C</span>
    </button>

    <div id="weather-card" style="display: none; position: absolute; top: 48px; right: 0; width: 200px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px; padding: 16px; color: white; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);">
      <h4 style="margin: 0 0 6px 0; font-size: 15px; letter-spacing: 0.5px;">Live Weather</h4>
      <p id="weather-location" style="margin: 2px 0; font-size: 13px; opacity: 0.8;">Detecting location...</p>
      <p id="weather-status" style="margin: 6px 0; font-size: 14px; font-weight: bold; color: #38bdf8;">--</p>
      <p id="weather-wind" style="margin: 2px 0; font-size: 12px; opacity: 0.7;">Wind: -- km/h</p>
    </div>
  </div>

  <div style="position: fixed; bottom: 30px; left: 15px; z-index: 20; background: rgba(10, 5, 20, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(168, 85, 247, 0.6); padding: 10px 18px; border-radius: 25px; display: flex; align-items: center; gap: 10px; color: #e9d5ff; font-weight: bold; font-family: monospace; animation: cursedPulse 4s infinite;">
    <span id="volume-icon" style="text-shadow: 0 0 8px #a855f7;">🔮</span>
    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" oninput="updateVolume(this.value)" style="cursor: pointer; width: 90px;">
    <span id="volume-val" style="font-size: 12px; min-width: 35px; color: #c084fc; text-shadow: 0 0 6px #a855f7;">80%</span>
  </div>

  <div id="search-widget" style="position: absolute; top: 12%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 8px; z-index: 10;">
    <input type="text" id="search-input" placeholder="Search Google..." onkeydown="handleSearch(event)" style="padding: 10px 18px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.7); background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(10px); color: #000000; font-weight: bold; font-size: 15px; outline: none; width: 300px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);">
    <button onclick="executeSearch()" style="padding: 10px 18px; border-radius: 20px; border: none; background: rgba(0, 0, 0, 0.65); color: #ffffff; font-weight: bold; cursor: pointer; backdrop-filter: blur(10px); transition: 0.2s;">Search</button>
  </div>

  <div id="domain-dock" style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(12px); padding: 12px 20px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); z-index: 10;">
    <button class="domain-btn" style="background: rgba(124, 58, 237, 0.7);" onclick="startSystem('gojo')">🌀 Gojo</button>
    <button class="domain-btn" style="background: rgba(220, 38, 38, 0.7);" onclick="startSystem('sukuna')">⛩️ Sukuna</button>
    <button class="domain-btn" style="background: rgba(13, 148, 136, 0.7);" onclick="startSystem('mahito')">🖐️ Mahito</button>
    <button class="domain-btn" style="background: rgba(234, 179, 8, 0.7);" onclick="startSystem('megumi')">🐺 Megumi</button>
    <button class="domain-btn" style="background: rgba(236, 72, 153, 0.7);" onclick="startSystem('yuta')">⚔️ Yuta</button>
  </div>

  <button id="back-btn" onclick="resetSystem()" style="display: none; position: fixed; bottom: 30px; right: 30px; padding: 12px 20px; background-color: #1e293b; color: white; border: 1px solid #ffffff44; border-radius: 25px; cursor: pointer; font-weight: bold; z-index: 99; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);">⬅ Back to Desktop</button>

  <script>
    let currentVolume = 0.8;
    let currentAudio = null;

    const domainTracks = {
      gojo: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73427.mp3",
      sukuna: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3",
      mahito: "https://cdn.pixabay.com/download/audio/2022/10/14/audio_99391e43d9.mp3",
      megumi: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3",
      yuta: "https://cdn.pixabay.com/download/audio/2022/03/10/audio_510b64f331.mp3"
    };

    function playDomainMusic(domain) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      if (domainTracks[domain]) {
        currentAudio = new Audio(domainTracks[domain]);
        currentAudio.volume = currentVolume;
        currentAudio.loop = true;
        currentAudio.play().catch(() => {});
      }
    }

    function updateVolume(val) {
      currentVolume = parseFloat(val);
      document.getElementById('volume-val').innerText = Math.round(currentVolume * 100) + '%';
      
      if (currentAudio) {
        currentAudio.volume = currentVolume;
      }
      
      const icon = document.getElementById('volume-icon');
      if (currentVolume === 0) icon.innerText = '🔇';
      else if (currentVolume < 0.5) icon.innerText = '🔮';
      else icon.innerText = '👁️';
    }

    function toggleWeatherModal() {
      const card = document.getElementById('weather-card');
      card.style.display = card.style.display === 'none' ? 'block' : 'none';
    }

    async function fetchLiveWeather() {
      const setFallback = () => {
        document.getElementById('weather-temp').innerText = '24°C';
        document.getElementById('weather-location').innerText = 'Shibuya, Tokyo';
        document.getElementById('weather-status').innerText = 'Clear Sky';
        document.getElementById('weather-wind').innerText = 'Wind: 12 km/h';
      };

      if (!('geolocation' in navigator)) {
        setFallback();
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        try {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
          const data = await res.json();
          
          const temp = Math.round(data.current_weather.temperature);
          const wind = data.current_weather.windspeed;
          
          document.getElementById('weather-temp').innerText = `${temp}°C`;
          document.getElementById('weather-location').innerText = 'Current Location';
          document.getElementById('weather-status').innerText = 'Live Update';
          document.getElementById('weather-wind').innerText = `Wind: ${wind} km/h`;
        } catch (e) {
          setFallback();
        }
      }, () => {
        setFallback();
      });
    }

    window.addEventListener('load', fetchLiveWeather);

    function executeSearch() {
      const query = document.getElementById('search-input').value;
      if (query.trim() !== '') {
        window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
      }
    }

    function handleSearch(event) {
      if (event.key === 'Enter') {
        executeSearch();
      }
    }

    function triggerAnimation(flashColor) {
      const overlay = document.getElementById('domain-overlay');
      overlay.style.backgroundColor = flashColor;
      overlay.classList.remove('active');
      void overlay.offsetWidth;
      overlay.classList.add('active');
    }

    function startSystem(domain) {
      // Hide the domain menu dock and the search widget
      document.getElementById('domain-dock').style.display = 'none';
      document.getElementById('search-widget').style.display = 'none';
      document.getElementById('back-btn').style.display = 'block';

      let speechText = "";
      let flashColor = "#ffffff";

      playDomainMusic(domain);

      if (domain === 'gojo') {
        flashColor = "#38bdf8";
        triggerAnimation(flashColor);
        document.body.style.backgroundImage = "url('https://wallpapercave.com/wp/wp12325840.jpg')";
        document.body.style.backgroundColor = '#0b0f19';
        document.body.style.color = '#38bdf8';
        speechText = "Domain Expansion... Unlimited Void.";
      } else if (domain === 'sukuna') {
        flashColor = "#fca5a5";
        triggerAnimation(flashColor);
        document.body.style.backgroundImage = "url('https://i.pinimg.com/originals/db/96/d6/db96d6a89f37c3f25dbe576406514dee.jpg')";
        document.body.style.backgroundColor = '#450a0a';
        document.body.style.color = '#fca5a5';
        speechText = "Domain Expansion... Malevolent Shrine.";
      } else if (domain === 'mahito') {
        flashColor = "#99f6e4";
        triggerAnimation(flashColor);
        document.body.style.backgroundImage = "url('https://images8.alphacoders.com/135/1353166.png')";
        document.body.style.backgroundColor = '#042f2e';
        document.body.style.color = '#99f6e4';
        speechText = "Domain Expansion... Self-Embodiment of Perfection.";
      } else if (domain === 'megumi') {
        flashColor = "#a855f7";
        triggerAnimation(flashColor);
        document.body.style.backgroundImage = "url('https://images3.alphacoders.com/134/1348123.png')";
        document.body.style.backgroundColor = '#18181b';
        document.body.style.color = '#c084fc';
        speechText = "Domain Expansion... Chimera Shadow Garden.";
      } else if (domain === 'yuta') {
        flashColor = "#f472b6";
        triggerAnimation(flashColor);
        document.body.style.backgroundImage = "url('https://images5.alphacoders.com/135/1353170.png')";
        document.body.style.backgroundColor = '#312e81';
        document.body.style.color = '#f472b6';
        speechText = "Domain Expansion... Authentic Mutual Love.";
      }

      if ('speechSynthesis' in window && speechText) {
        window.speechSynthesis.cancel();
        const chant = new SpeechSynthesisUtterance(speechText);
        chant.pitch = 0.6;
        chant.rate = 0.85;
        chant.volume = currentVolume;
        window.speechSynthesis.speak(chant);
      }
    }

    function resetSystem() {
      // Bring back the domain dock and search bar widget
      document.getElementById('domain-dock').style.display = 'flex';
      document.getElementById('search-widget').style.display = 'flex';
      document.getElementById('back-btn').style.display = 'none';

      document.body.style.backgroundImage = "url('https://images7.alphacoders.com/132/1322952.jpeg')";
      document.body.style.color = '#ffffff';

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }
  </script>
</body>
</html>
